<!DOCTYPE html>

<title>
CCLUX Furnishings | Custom Furniture Solutions
</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

font-family:
Arial,
Helvetica,
sans-serif;

color:white;

}


.hero{

min-height:100vh;

background-image:

linear-gradient(
90deg,
rgba(0,0,0,0.55),
rgba(0,0,0,0.25)
),

url("images/hero.jpg");


background-size:cover;

background-position:center;

}


/* HEADER */

.header{

display:flex;

align-items:center;

justify-content:space-between;

padding:30px 5%;

}


.logo{

font-size:28px;

font-weight:700;

letter-spacing:6px;

line-height:1.2;

text-transform:uppercase;

}


.nav{

display:flex;

gap:35px;

}


.nav a{

color:white;

text-decoration:none;

font-size:17px;

}


.quote{

border:1px solid white;

padding:15px 35px;

font-size:16px;

}


/* HERO CONTENT */


.hero-content{


padding:

120px 5%;


max-width:800px;


}


.hero-title{


font-size:

clamp(34px,4vw,48px);


font-weight:600;


line-height:1.25;


margin-bottom:30px;


}



.hero-description{


font-size:20px;


line-height:1.6;


max-width:650px;


margin-bottom:45px;


color:
rgba(255,255,255,0.9);


}



/* BUTTON */


.buttons{

display:flex;

gap:25px;

}


.btn{


padding:18px 40px;


font-size:17px;


text-decoration:none;


}



.btn-white{

background:white;

color:#111;

}



.btn-border{


border:1px solid white;

color:white;


}


/* MOBILE */


@media(max-width:900px){


.header{

flex-wrap:wrap;

}


.nav{

display:none;

}



.hero-content{


padding-top:90px;


}


.hero-title{


font-size:36px;


}


.hero-description{

font-size:17px;

}


.buttons{

flex-direction:column;

}


.btn{

text-align:center;

}


}


</style>


</head>


<body>


<section class="hero">


<header class="header">


<div class="logo">

CCLUX<br>
FURNISHINGS

</div>


<nav class="nav">

<a href="#">Indoor Furniture</a>

<a href="#">Outdoor Furniture</a>

<a href="#">Projects</a>

<a href="#">Partner With Us</a>

</nav>


<a class="quote">

Get a Quote

</a>


</header>




<div class="hero-content">



<h1 class="hero-title">


Custom Furniture Solutions for European Villas,
Apartments & Resorts


</h1>



<p class="hero-description">


Creating elegant living spaces with customized
indoor and outdoor furniture.


</p>



<div class="buttons">


<a class="btn btn-white">

View Our Projects

</a>



<a class="btn btn-border">

Discuss Your Project

</a>


</div>



</div>
